## Funzzy events file
# Fast edit loop by default; expensive gates are explicit targets.
#
# Run the edit loop:   fzz --restart watch @quick
# Run final checks:    fzz control run @agent-final --wait
# Run Nix checks:      fzz control run @nixbuild --wait

on:
  socket: .tmp/funzzy/control.sock
  ignore:
    - "src/**/*log*"
    # Watchers can emit either the directory event or events for files inside it.
    - "**/.pi"
    - "**/.pi/**"

execution:
  concurrency: 2

tasks:
  # These two contiguous tasks overlap. Formatting is cheap while the test
  # task owns all compilation, avoiding the previous build/test duplication.
  - name: format @quick @agent-final
    parallel: quick-check
    run: direnv exec . cargo fmt --all
    run_on_init: true
    change:
      - "src/**/*.rs"
      - "tests/**/*.rs"
    ignore:
      - "**/*.md"

  - name: unit tests @quick @agent-final
    parallel: quick-check
    run:
      - direnv exec . cargo test
    run_on_init: true
    change:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/**"
      - "docs/**"

  # Full integration is intentionally manual. It takes about eight minutes
  # and spawns real watchers, so running it on every edit slows feedback and
  # risks exhausting the process table. Keep test threads serialized.
  - name: integration @agent-final
    parallel: quick-check
    run: "direnv exec . cargo test --features test-integration --test ${INTEGRATION_TEST:-'*'} -- --nocapture --test-threads=1"
    change:
      - "src/**"
      - "tests/**"
    # Ignore every filesystem event; explicit target runs do not path-filter.
    ignore: "**"

  # Nix is a separate packaging gate. Nix commands already build the package;
  # an extra cargo release build here only duplicated that work.
  - name: nix checks @nixbuild
    run:
      - direnv exec . make nix-flake-check
      - direnv exec . make nix-build-nightly
    change:
      - "**/*.nix"
      - "flake.lock"
    ignore:
      - "**/*.txt"

  - name: install locally @quick
    # Opt in by creating .tmp/install.
    run: |
      if [ -f .tmp/install ]; then
        echo "Installing locally"
        direnv exec . cargo install --path . --force
      else
        echo "Skipping local install, create .tmp/install to enable"
      fi
    change:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
