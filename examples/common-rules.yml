# Example: Common Rules Among Tasks
#
# This example demonstrates the `on` format that allows sharing common
# change and ignore patterns across multiple tasks.
#
# Benefits:
# - Reduces duplication of watch patterns
# - Makes configuration more maintainable
# - Individual tasks extend the common rules
#
# Note: For organizing tasks into multiple groups with different common rules,
# see examples/nested-groups.yml

# Common rules shared by all tasks
on:
  change:
    - "src/**"
    - "lib/**"
  ignore:
    - "**/*.log"
    - "**/*.tmp"
    - "**/node_modules/"

# Individual tasks inherit and extend the common rules
tasks:
  # This task inherits all common rules
  - name: build
    run: cargo build

  # This task inherits all common rules and runs on startup
  - name: typecheck
    run: cargo check
    run_on_init: true

  # This task extends the common 'change' patterns
  - name: test
    run: cargo test
    change: "tests/**"

  # This task extends both 'change' and 'ignore'
  - name: lint
    run: cargo clippy
    change: "src/**/*.rs"
    ignore:
      - "src/generated/**"
      - "**/*.bak"

  # This task inherits common rules
  - name: format
    run: cargo fmt
