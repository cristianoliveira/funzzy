name: CI Checks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt

      - name: Build
        run: make prebuild

      - name: Linter 
        run: make lint

      - name: Run unit tests
        run: make tests
