name: CI integration tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Run integration
        # Serialize test threads: the suite spawns real watcher processes and
        # timing-sensitive assertions (reload, cancel, timeout bounds) flake
        # under parallel threads on fast CI runners. This matches the
        # deterministic agent-final gate (see .watch.yaml).
        run: cargo test --features test-integration --test '*' -- --test-threads=1

      - name: Run integration e2e tests
        run: make integration-e2e
