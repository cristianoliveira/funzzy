name: Release (multi-arch with Nix)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag to build and attach (must exist)'
        required: false
        default: ''
      ref:
        description: 'Git ref to build from (defaults to the tag; point at a branch to rebuild an immutable tag with fixed build wiring)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            system: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-linux  
            system: aarch64-linux
          - os: macos-latest
            target: x86_64-darwin
            system: x86_64-darwin
          - os: macos-latest
            target: aarch64-darwin
            system: aarch64-darwin

    env:
      TARGET: ${{ matrix.target }}
      SYSTEM: ${{ matrix.system }}
      # Tag push: the pushed tag. Manual dispatch: the explicit tag input
      # (defaults to the dispatched ref name so naming fails visibly).
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # Tag push: the pushed tag. Manual dispatch: the explicit build ref
      # (defaults to the tag) so an immutable tag can be rebuilt from a
      # branch carrying build-wiring fixes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # macOS runner images ship Nix pre-installed; v31 detects it and
          # skips reinstall. extra-sandbox-paths for macOS SDK frameworks were
          # removed: they broke Linux runners and package.nix notes the default
          # SDK (via SDKROOT) provides CoreServices now.
          extra_nix_config: |
            extra-platforms = aarch64-linux i686-linux aarch64-darwin x86_64-darwin

      - name: Build with Nix
        shell: bash
        run: |
          set -euxo pipefail
          
          # Check if we need cross-compilation
          NATIVE_SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          echo "Native system: $NATIVE_SYSTEM"
          echo "Target system: $SYSTEM"
          
          if [[ "$SYSTEM" == "$NATIVE_SYSTEM" ]]; then
            echo "Building natively for $SYSTEM"
            nix build .#local --verbose -L
          elif [[ "$SYSTEM" == "aarch64-linux" ]]; then
            # True cross-compilation: every build-time tool (rustc, the cargo
            # vendor fetcher) runs natively on the host; only the artifacts
            # target aarch64. Emulation (qemu-user) breaks nixpkgs'
            # PATH-resolving python wrappers and never produced a green run.
            echo "Cross-compiling for $SYSTEM from $NATIVE_SYSTEM"
            nix build .#local-aarch64 --verbose -L
          elif [[ "$NATIVE_SYSTEM" == "x86_64-darwin" ]]; then
            # macOS native cross-compilation
            nix build .#local --system $SYSTEM --verbose -L
          else
            echo "Cross-compilation from $NATIVE_SYSTEM to $SYSTEM may not be supported"
            nix build .#local --verbose -L
          fi

      - name: Package binaries
        shell: bash
        run: |
          set -euxo pipefail
          
          # Create package directory
          mkdir -p pkg
          
          # Copy binaries from the Nix store
          if [[ -d "result/bin" ]]; then
            cp result/bin/funzzy pkg/
            cp result/bin/fzz pkg/
          else
            echo "ERROR: result/bin directory not found"
            find result -name "funzzy" -type f | head -1 | xargs -I {} cp {} pkg/ || echo "funzzy not found"
            find result -name "fzz" -type f | head -1 | xargs -I {} cp {} pkg/ || echo "fzz not found"
          fi
          
          # Verify binaries were copied and are executable
          ls -la pkg/
          chmod +x pkg/* || true
          
          # Test the binaries (basic smoke test)
          if [[ "$TARGET" == *"linux"* ]]; then
            ./pkg/funzzy --version || echo "Binary test failed (may be cross-compiled)"
            ./pkg/fzz --version || echo "Binary test failed (may be cross-compiled)"
          fi
          
          # Create archive + checksum (TASK-0063: every published archive
          # ships a verifiable sha256 alongside it).
          tar czf "funzzy-${RELEASE_TAG}-${TARGET}.tar.gz" pkg
          shasum -a 256 "funzzy-${RELEASE_TAG}-${TARGET}.tar.gz" \
            | tee "funzzy-${RELEASE_TAG}-${TARGET}.tar.gz.sha256"
          echo "ARTIFACT=funzzy-${RELEASE_TAG}-${TARGET}.tar.gz" >> $GITHUB_ENV
          echo "ARTIFACT_SHA=funzzy-${RELEASE_TAG}-${TARGET}.tar.gz.sha256" >> $GITHUB_ENV

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT_SHA }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
