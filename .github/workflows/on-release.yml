name: Release publish to crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag to publish from (must equal Cargo version)'
        required: false
        default: ''
  release:
    types: [created]

jobs:
  publish_crates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          # Release-created: the release tag. Manual dispatch: explicit tag input
          # (defaults to the dispatched ref's SHA so the gate fails closed).
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Build
        run: make build

      - name: Version identity gate (exact tag/version/package equality)
        run: |
          git fetch --tags --force
          scripts/version-check --release

      - name: Verify the fzz alias package
        run: scripts/fzz-alias-check

      - name: Verify the canonical crate payload
        run: bash scripts/package-contents-check

      - name: Publish canonical crate, then exact-version alias
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"

          # crates.io rejects curl's default user agent with HTTP 403. A
          # blocked lookup must never be mistaken for an unpublished version.
          CRATES_USER_AGENT="funzzy-release/$VERSION (https://github.com/cristianoliveira/funzzy)"
          crates_api() {
            curl --fail --silent --show-error --user-agent "$CRATES_USER_AGENT" \
              "https://crates.io/api/v1/$1"
          }

          crate_version_exists() {
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user-agent "$CRATES_USER_AGENT" \
              "https://crates.io/api/v1/crates/$1/$VERSION")" || {
              echo "crates.io lookup for $1 $VERSION failed" >&2
              exit 1
            }
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "crates.io lookup for $1 $VERSION returned HTTP $status" >&2; exit 1 ;;
            esac
          }

          verify_owner() {
            crates_api "crates/$1/owners" |
              python3 -c 'import json,sys; users=json.load(sys.stdin)["users"]; assert any(user["login"] == "cristianoliveira" for user in users)'
          }

          if crate_version_exists funzzy; then
            echo "funzzy $VERSION already exists; verifying owner and resuming."
            verify_owner funzzy
          else
            cargo publish --token "$CRATES_TOKEN"
          fi

          # The alias has an exact registry dependency. Wait until a newly
          # published canonical version is visible before publishing it.
          for attempt in $(seq 1 60); do
            if crate_version_exists funzzy; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "funzzy $VERSION did not become visible within five minutes" >&2
              exit 1
            fi
            sleep 5
          done

          if crate_version_exists fzz; then
            echo "fzz $VERSION already exists; verifying owner and resuming."
            verify_owner fzz
          else
            cargo publish --manifest-path crates/fzz/Cargo.toml --dry-run
            cargo publish --manifest-path crates/fzz/Cargo.toml --token "$CRATES_TOKEN"
          fi

          verify_owner fzz
          crates_api "crates/fzz/$VERSION/dependencies" |
            python3 -c 'import json,sys; version=sys.argv[1]; deps=json.load(sys.stdin)["dependencies"]; assert any(dep["crate_id"] == "funzzy" and dep["req"] == f"={version}" for dep in deps)' "$VERSION"
