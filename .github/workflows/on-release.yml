name: Release publish to crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag to publish from (must equal Cargo version)'
        required: false
        default: ''
  release:
    types: [created]

jobs:
  publish_crates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          # Release-created: the release tag. Manual dispatch: explicit tag input
          # (defaults to the dispatched ref's SHA so the gate fails closed).
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Build
        run: make build

      - name: Version + docs drift gate (exact tag/version/package equality)
        run: |
          git fetch --tags --force
          # Self-contained identity gate. Runs from the immutable tag checkout
          # (RELEASE-BOUNDARY §5); the stable Nix package is the FINAL channel
          # and is enforced by its own gate at promotion, so it is intentionally
          # not part of this check.
          CARGO="$(grep -m1 '^version' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          LOCK="$(grep -A1 'name = "funzzy"' Cargo.lock | grep '^version' | head -1 | sed 's/^version = "\(.*\)"/\1/')"
          test "$CARGO" = "$LOCK" || { echo "Cargo.toml ($CARGO) != Cargo.lock ($LOCK)"; exit 1; }
          echo "Cargo version:   $CARGO"
          echo "Lock version:    $LOCK"
          test "v${CARGO}" = "$(git describe --tags --exact-match HEAD)" || \
            { echo "tag must equal v<Cargo version>"; exit 1; }
          make docs-drift

      - name: Publish crate
        run: cargo publish --token ${CRATES_TOKEN}
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
