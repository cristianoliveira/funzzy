[package]
name = "funzzy"
version = "2.0.0"
authors = ["Cristian Oliveira <me@cristianoliveira.com>"]
description = "A lightweight blazingly fast file watcher"
license = "MIT"
repository = "https://github.com/cristianoliveira/funzzy"
edition = "2021"
# Publish only the crate source + docs; never plans/reports/pi-watcher/
# submodule or local state (release candidate, TASK-0062).
include = [
    "src/**",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "docs/**",
    "examples/**",
    "nix/**",
    "scripts/**",
    "!pi-watcher/**",
    "!src/.pi/**",
    "!**/*.log",
    "!**/*.sock",
]
# Minimum supported Rust version. Clap 4.6 (used by the CLI refactor) and its
# baseline tracks latest stable; keep in sync with the Nix toolchain and CI pins.
rust-version = "1.97"
default-run = "funzzy" # the binary to run when `cargo run` is called

[profile.release]
lto = true # See https://doc.rust-lang.org/cargo/reference/profiles.html#lto

[features]
test-integration-e2e = ["test-integration-file-system", "test-integration"]
test-integration-file-system = []
test-integration = []

[dependencies]
serde = "1.0" # if you're using `derive(Deserialize)`
serde_derive = "1.0" # if you're using `derive(Deserialize)`
serde_json = "1.0"
toon = { version = "0.1.2", default-features = false }
ignore = "0.4.33"
notify = "4.0.0"
yaml-rust = "0.4.5"
glob="^0.3"
notify-debouncer-mini = "0.3.0"
nix = "0.26.2"
once_cell = "1.19"
clap = "4.6"
clap_complete = "4.5"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "=2.1.2"
predicates = "3.1.0"
pretty_assertions = "1.4.1"

[[bin]]
name = "funzzy"
path = "src/main.rs"

# alias
[[bin]]
name = "fzz"
path = "src/fzz.rs"
